; deskbuddy-firmware
; esp32  : Waveshare ESP32-S3-Touch-AMOLED-1.75
; sim    : headless simulator op de PC (rendert frames naar bestanden), zie tools/sim.sh
; emu    : interactieve emulator in een venster (SDL2), zie tools/emu.sh

[platformio]
default_envs = esp32

[common]
lvgl = https://github.com/lvgl/lvgl.git#v9.5.0
build_flags =
  -I include
  -D LV_CONF_INCLUDE_SIMPLE

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:scripts/embed_web.py
build_src_filter = +<*> -<sim/> -<emu/>
build_flags =
  ${common.build_flags}
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  ${common.lvgl}
  https://github.com/moononournation/Arduino_GFX.git#v1.6.7
  https://github.com/lewisxhe/SensorLib.git#v0.4.1
  https://github.com/lewisxhe/XPowersLib.git#v0.3.3

[env:sim]
platform = native
build_src_filter = +<sim/>
build_flags =
  ${common.build_flags}
  -D DESKBUDDY_SIM
  -std=gnu++17
  -O2
lib_deps =
  ${common.lvgl}
lib_compat_mode = off

[env:emu]
platform = native
build_src_filter = +<emu/>
build_flags =
  ${common.build_flags}
  -D DESKBUDDY_SIM
  -std=gnu++17
  -O2
  !pkg-config --cflags --libs sdl2
lib_deps =
  ${common.lvgl}
lib_compat_mode = off
