<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>deskbuddy</title>
<style>
:root{--bg:#0b0f12;--card:#141b20;--line:#22303a;--text:#e6f0f2;--dim:#8a989c;--accent:#6ee7f7;--accent2:#ff6fa8;--ok:#5be37d;--warn:#ffb347;--bad:#ff5a4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;padding-bottom:40px}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:50%;background:#000;border:2px solid var(--accent);display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px 9px}
.logo i{background:var(--accent);border-radius:3px}
h1{font-size:20px;margin:0}
#sub{color:var(--dim);font-size:13px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:#1c262d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font:inherit;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#04151a;border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=password]{width:100%;background:#0e1418;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.stat span:nth-child(odd){color:var(--dim)}
.nets{display:grid;gap:6px;margin:8px 0;max-height:220px;overflow:auto}
.nets button{text-align:left;display:flex;justify-content:space-between}
#log{font:12px ui-monospace,monospace;color:var(--dim);white-space:pre-wrap;margin-top:8px;max-height:120px;overflow:auto}
progress{width:100%;height:8px;accent-color:var(--accent)}
.muted{color:var(--dim);font-size:13px}
label.check{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;margin-top:10px}
label.check input{width:20px;height:20px;accent-color:var(--accent)}
.status{margin:10px 0 0;padding:10px;border-radius:10px;background:#0e1418;border:1px solid var(--line)}
.status.ok{border-color:var(--ok);color:var(--ok)}
.status.bad{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><i></i><i></i></div>
    <div><h1>deskbuddy</h1><div id="sub">verbinden…</div></div>
  </header>

  <section>
    <h2>Emotie</h2>
    <div class="grid" id="emotions"></div>
    <div class="row" style="margin-top:8px">
      <button data-cmd="blink">Knipper</button>
      <button data-cmd="bounce">Stuiter</button>
      <button data-cmd="gesture shake">Schud</button>
    </div>
  </section>

  <section>
    <h2>Uiterlijk &amp; geluid</h2>
    <div class="row">
      <button id="skin-classic" data-cmd="skin classic">Robot</button>
      <button id="skin-mascot" data-cmd="skin mascot">Mascotte</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="sound-btn">Geluid</button>
      <button data-cmd="sound happy">Test geluid</button>
    </div>
    <label for="volume">Volume <span id="volume-v"></span></label>
    <input type="range" id="volume" min="0" max="100">
    <label for="brightness">Helderheid <span id="brightness-v"></span></label>
    <input type="range" id="brightness" min="10" max="255">
    <label for="sleep">In slaap vallen na</label>
    <select id="sleep">
      <option value="1">1 minuut</option><option value="3">3 minuten</option><option value="5">5 minuten</option>
      <option value="10">10 minuten</option><option value="30">30 minuten</option><option value="0">Nooit</option>
    </select>
  </section>

  <section>
    <h2>Status</h2>
    <div class="stat" id="stat"></div>
  </section>

  <section>
    <h2>Wi-Fi</h2>
    <p class="muted" id="wifi-now"></p>
    <button id="scan">Netwerken zoeken</button>
    <div class="nets" id="nets"></div>
    <label for="ssid">Netwerk</label>
    <input type="text" id="ssid" autocomplete="off" autocapitalize="none">
    <label for="pass">Wachtwoord</label>
    <input type="password" id="pass" autocomplete="off">
    <label class="check"><input type="checkbox" id="showpass"> Wachtwoord tonen</label>
    <div class="row" style="margin-top:10px">
      <button id="join" class="on">Verbinden</button>
      <button data-cmd="wifi forget">Vergeten</button>
    </div>
    <p id="join-status" class="status" hidden></p>
  </section>

  <section>
    <h2>Firmware bijwerken</h2>
    <p class="muted">Kies <code>firmware.bin</code> (uit <code>firmware/.pio/build/esp32/</code>).</p>
    <input type="file" id="fw" accept=".bin">
    <progress id="fw-p" value="0" max="100" hidden></progress>
  </section>

  <section>
    <h2>Commando</h2>
    <div class="row"><input type="text" id="cmd" placeholder="help" autocapitalize="none"><button id="send" style="flex:0 0 90px">Stuur</button></div>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const EMO = [["neutral","Neutraal"],["happy","Blij"],["sad","Verdrietig"],["angry","Boos"],["surprised","Verrast"],["sleepy","Slaperig"],["love","Verliefd"],["dizzy","Duizelig"],["asleep","Slapen"]];
let st = {};

async function cmd(c) {
  try {
    const r = await fetch("/api/cmd", {method: "POST", body: new URLSearchParams({c})});
    const j = await r.json();
    log(`> ${c}\n${j.reply}`);
    refresh();
    return j;
  } catch (e) { log(`> ${c}\n(fout: ${e})`); }
}
function log(t) { const l = $("#log"); l.textContent = (t + "\n" + l.textContent).slice(0, 2000); }

const eg = $("#emotions");
for (const [k, n] of EMO) {
  const b = document.createElement("button");
  b.textContent = n; b.dataset.emo = k; b.onclick = () => cmd(`emotion ${k} 6000`);
  eg.append(b);
}
document.addEventListener("click", e => { const c = e.target.closest("[data-cmd]"); if (c) cmd(c.dataset.cmd); });
$("#sound-btn").onclick = () => cmd(`sound ${st.sound ? "off" : "on"}`);
for (const id of ["volume", "brightness"]) {
  const el = $("#" + id);
  el.oninput = () => $(`#${id}-v`).textContent = el.value;
  el.onchange = () => cmd(`${id} ${el.value}`);
}
$("#sleep").onchange = e => cmd(`sleep ${e.target.value}`);
$("#send").onclick = () => { const c = $("#cmd").value.trim(); if (c) cmd(c); };
$("#cmd").onkeydown = e => { if (e.key === "Enter") $("#send").click(); };

async function refresh() {
  try {
    st = await (await fetch("/api/status")).json();
  } catch { $("#sub").textContent = "geen verbinding"; return; }
  const wifi = {sta: `verbonden met ${st.ssid}`, ap: `setup-netwerk ${st.ssid}`, connecting: `verbinden met ${st.ssid}…`, off: "uit"}[st.wifi];
  $("#sub").textContent = `${st.emotion} · v${st.version}`;
  document.querySelectorAll("[data-emo]").forEach(b => b.classList.toggle("on", b.dataset.emo === st.emotion));
  $("#skin-classic").classList.toggle("on", st.skin === "classic");
  $("#skin-mascot").classList.toggle("on", st.skin === "mascot");
  const sb = $("#sound-btn"); sb.classList.toggle("on", st.sound); sb.textContent = st.sound ? "Geluid aan" : "Geluid uit";
  for (const id of ["volume", "brightness"]) {
    const el = $("#" + id);
    if (document.activeElement !== el) { el.value = st[id]; $(`#${id}-v`).textContent = st[id]; }
  }
  if (document.activeElement !== $("#sleep")) $("#sleep").value = String(st.sleep);
  const batt = st.battery < 0 ? "USB" : `${st.battery}%${st.charging ? " (laden)" : ""}`;
  $("#stat").innerHTML = [["Wi-Fi", wifi], ["IP", st.ip || "-"], ["Signaal", st.wifi === "sta" ? `${st.rssi} dBm` : "-"],
    ["Accu", batt], ["Inactief", `${st.idle} s`]].map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join("");
  $("#wifi-now").textContent = `Nu: ${wifi}`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

$("#scan").onclick = async () => {
  $("#scan").textContent = "Zoeken…";
  for (let i = 0; i < 20; i++) {
    const j = await (await fetch("/api/wifi/scan")).json();
    if (!j.scanning) {
      const seen = new Set();
      $("#nets").innerHTML = "";
      for (const n of j.networks.sort((a, b) => b.rssi - a.rssi)) {
        if (!n.ssid || seen.has(n.ssid)) continue;
        seen.add(n.ssid);
        const b = document.createElement("button");
        b.innerHTML = `<span>${esc(n.ssid)}${n.open ? "" : " 🔒"}</span><span class="muted">${n.rssi} dBm</span>`;
        b.onclick = () => { $("#ssid").value = n.ssid; $("#pass").focus(); };
        $("#nets").append(b);
      }
      break;
    }
    await new Promise(r => setTimeout(r, 700));
  }
  $("#scan").textContent = "Netwerken zoeken";
};
$("#showpass").onchange = e => $("#pass").type = e.target.checked ? "text" : "password";

function joinStatus(text, cls) {
  const s = $("#join-status");
  s.hidden = false; s.textContent = text; s.className = "status " + (cls || "");
}
$("#join").onclick = async () => {
  const ssid = $("#ssid").value.trim(), pass = $("#pass").value;
  if (!ssid) { joinStatus("Kies of typ eerst een netwerk.", "bad"); return; }
  $("#join").disabled = true;
  joinStatus(`Verbinden met ${ssid}…`);
  try {
    await fetch("/api/wifi", {method: "POST", body: new URLSearchParams({ssid, pass})});
  } catch {}
  for (let i = 0; i < 32; i++) {
    await new Promise(r => setTimeout(r, 1000));
    let j;
    try { j = await (await fetch("/api/wifi/state")).json(); } catch { continue; }
    if (j.sta === "connected") {
      joinStatus(`Verbonden met ${j.ssid}! IP-adres: ${j.ip}. Over ${Math.max(j.switchIn, 0)} s schakelt de deskbuddy over; ` +
        `verbind je telefoon dan weer met je thuisnetwerk en open http://${j.ip} (of http://deskbuddy.local).`, "ok");
      if (j.switchIn <= 1) break;
      continue;
    }
    if (j.sta === "failed" && (j.reason.includes("wachtwoord") || i > 25)) {
      joinStatus(`Niet gelukt: ${j.reason || "onbekende fout"}. Controleer het wachtwoord en probeer opnieuw.`, "bad");
      break;
    }
    joinStatus(`Verbinden met ${ssid}… (${i + 1} s)`);
  }
  $("#join").disabled = false;
};

$("#fw").onchange = () => {
  const f = $("#fw").files[0]; if (!f) return;
  const p = $("#fw-p"); p.hidden = false;
  const fd = new FormData(); fd.append("firmware", f, f.name);
  const x = new XMLHttpRequest();
  x.upload.onprogress = e => { if (e.lengthComputable) p.value = e.loaded / e.total * 100; };
  x.onload = () => { log(`update: ${x.responseText}`); setTimeout(() => location.reload(), 8000); };
  x.onerror = () => log("update: verbinding verbroken (herstart hij?)");
  x.open("POST", "/update"); x.send(fd);
};

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
