# Publiceert de PWA (firmware/web) op GitHub Pages: https://newmedia.github.io/deskbuddy/
# Daar draait hij via https, en dat is nodig voor Web Bluetooth en om hem als app te installeren.
name: PWA naar GitHub Pages

on:
  push:
    branches: [main]
    paths: ["firmware/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: firmware/web
      - id: deployment
        uses: actions/deploy-pages@v4
